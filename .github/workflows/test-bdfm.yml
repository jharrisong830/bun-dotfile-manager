name: test-bdfm
run-name: Test for ${{ github.event_name }} on ${{ github.ref }}
on: [push]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: "latest"
            - name: Run tests
              run: bun test
              